<!doctype html>
<html lang="pt-BR" class="dark" data-accent="yellow" data-surface="glass" data-radius="balanced">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PontoFácil Pernambucanas - Studio de Ponto Automatizado</title>
    <meta name="description" content="Automação para registro de ponto no portal Pernambucanas LG Cloud com widgets no celular, alarme de almoço, banco de horas e estúdio visual interativo." />
    <meta property="og:title" content="PontoFácil Pernambucanas - Studio de Ponto Automatizado" />
    <meta property="og:description" content="Automação para registro de ponto no portal Pernambucanas LG Cloud com widgets no celular, alarme de almoço, banco de horas e estúdio visual interativo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#090a0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PontoFácil" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ponto_pernambucanas_config_v1');
          if (raw) {
            var cfg = JSON.parse(raw);
            var root = document.documentElement;
            if (cfg && typeof cfg.isDarkMode === 'boolean') {
              root.classList.toggle('dark', cfg.isDarkMode);
            }
            if (cfg && cfg.themeColor) {
              root.setAttribute('data-accent', cfg.themeColor);
            }
            if (cfg && cfg.surfaceStyle) {
              root.setAttribute('data-surface', cfg.surfaceStyle);
            }
            if (cfg && cfg.radiusStyle) {
              root.setAttribute('data-radius', cfg.radiusStyle);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
